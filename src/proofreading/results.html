<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connectome · Results</title><style>
:root{font:16px system-ui;color:#173a35;background:#f0f4f1}body{max-width:1100px;margin:auto;padding:20px}h1{font-size:24px}select,button,input{font:inherit;min-height:44px}select{width:100%;margin:12px 0}button{padding:8px 14px;border:1px solid #8ea89b;border-radius:8px;background:white;color:#175b48}button:disabled{opacity:.5}.pair{display:grid;grid-template-columns:1fr 1fr;background:#09151d;border-radius:12px;overflow:hidden;color:#c4d8de}.pane{min-width:0}.pane+ .pane{border-left:1px solid #31434d}h2{font-size:14px;padding:12px;margin:0}.image{aspect-ratio:1.28;display:grid;place-items:center;position:relative}.image img{position:absolute;width:100%;height:100%;object-fit:contain}.meta{padding:10px;font-size:12px;min-height:30px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.bar input{flex:1;min-width:100px}.card{background:white;border:1px solid #d0ddd5;border-radius:10px;padding:18px;margin:15px 0}#text{white-space:pre-wrap;line-height:1.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#status{font-size:14px}#slices:empty{display:none}a{color:#175b48}</style>
<h1>Connectome results</h1><p>Recorded model views, actions, and final scores.</p><select id="runs" aria-label="Episode"></select><p id="status"></p>
<div class="pair"><section class="pane"><h2>EM view</h2><div class="image"><span id="emEmpty">No recorded EM view</span><img id="em" alt="Model-visible EM" hidden></div><div id="emMeta" class="meta"></div></section><section class="pane"><h2>Segment view</h2><div class="image"><span id="segmentEmpty">No recorded segment view</span><img id="segment" alt="Model-visible segments" hidden></div><div id="segmentMeta" class="meta"></div></section></div>
<div id="slices" class="bar"></div><div class="bar"><button id="prev">Previous</button><button id="play">Play</button><button id="next">Next</button><input id="step" type="range" min="0" max="0" value="0" aria-label="Action"><span id="count"></span></div>
<div class="card"><h2 id="action"></h2><div id="text"></div><details><summary>Tool arguments and status</summary><pre id="arguments"></pre></details></div><details class="card"><summary>Final evaluator scores</summary><p>Scores describe the final run, not the currently displayed action. Unknown material is not certified correct.</p><pre id="scores"></pre></details>
<script>
const $=id=>document.getElementById(id);let frames=[],index=0,timer=null,serial=0;
function stop(){clearInterval(timer);timer=null;$('play').textContent='Play'}
function views(v){for(const key of ['em','segment']){const path=v[key];$(key).hidden=!path;$(key+'Empty').hidden=!!path;if(path)$(key).src='/episodes/'+encodeURIComponent($('runs').value)+'/'+path;else $(key).removeAttribute('src');$(key+'Meta').textContent=path?(v[key+'_step']===index?'View from this action':'Last recorded view · action '+v[key+'_step']):''}}
function show(){if(!frames.length)return;const f=frames[index];views(f);$('step').value=index;$('count').textContent=index+' / '+(frames.length-1);$('prev').disabled=index===0;$('next').disabled=index===frames.length-1;$('action').textContent=index===0?'Starting view':index+' · '+f.tool;$('text').textContent=f.text||'No outward explanation recorded.';$('arguments').textContent=JSON.stringify({arguments:f.arguments,ok:f.ok,error:f.error},null,2);$('slices').replaceChildren();if((f.views||[]).length>1)f.views.forEach((v,i)=>{const b=document.createElement('button');b.textContent='View '+(i+1);b.onclick=()=>views(v);$('slices').append(b)})}
async function load(){stop();const request=++serial;frames=[];index=0;views({});for(const id of ['prev','next','play','step'])$(id).disabled=true;$('text').textContent='Loading…';$('scores').textContent='';try{const r=await fetch('/episodes/'+encodeURIComponent($('runs').value)+'/snapshot');const data=await r.json();if(!r.ok)throw Error(data.error);if(request!==serial)return;frames=data.frames;$('step').max=frames.length-1;$('scores').textContent=JSON.stringify(data.scores,null,2);$('play').disabled=$('step').disabled=false;show()}catch(e){if(request===serial)$('text').textContent=e.message}}
$('runs').onchange=load;$('prev').onclick=()=>{stop();index--;show()};$('next').onclick=()=>{stop();index++;show()};$('step').oninput=()=>{stop();index=Number($('step').value);show()};$('play').onclick=()=>{if(timer)return stop();if(index===frames.length-1)index=0;show();$('play').textContent='Pause';timer=setInterval(()=>{if(index>=frames.length-1)return stop();index++;show()},1300)};
fetch('/api/episodes').then(r=>r.json()).then(rows=>{for(const r of rows){const o=document.createElement('option');o.value=r.id;o.textContent=r.name+' · '+r.summary.model+' · '+r.summary.status;$('runs').append(o)}$('status').textContent=rows.length+' saved episodes';if(rows.length)load();else{for(const id of ['prev','next','play','step'])$(id).disabled=true;$('text').textContent='No completed observations found. Point the server at a results directory.'}}).catch(e=>{$('status').textContent=e.message});
</script></html>
