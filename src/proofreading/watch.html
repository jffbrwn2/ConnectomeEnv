<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connectome · Live agent</title>
<style>body{background:#0b1018;color:#e2ecfa;font:15px system-ui;margin:24px}header{display:flex;justify-content:space-between;border-bottom:1px solid #29384d;padding-bottom:18px}h1{font-size:22px;margin:0}small{color:#9cb7cf}main{display:grid;grid-template-columns:2fr 1fr;gap:22px;margin-top:22px}img{width:100%;height:78vh;object-fit:contain;background:#101a29;border-radius:12px}aside{background:#111b29;border:1px solid #29384d;border-radius:12px;padding:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto}#status{color:#8ce0be}@media(max-width:800px){main{grid-template-columns:1fr}}</style>
<header><div><h1>Connectome / live agent</h1><small>Exact observations and actions from the running episode</small></div><span id="status">Waiting for observations</span></header><main><img id="image" alt="Latest agent observation"><aside><h2 id="step">Episode starting</h2><small>Read-only observer · viewing does not change the agent’s camera or edits</small><pre id="events"></pre></aside></main>
<script>const token='__TOKEN__',$=id=>document.getElementById(id);let seen=0,blob=null;async function get(path){let r=await fetch(path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Observer disconnected');return r}function images(x){if(!x||typeof x!=='object')return [];return Object.entries(x).flatMap(([k,v])=>k==='image'&&typeof v==='string'?[v]:images(v))}async function poll(){try{let events=await (await get('/api/events')).json();for(let e of events.filter(e=>e.step>seen)){seen=e.step;$('step').textContent=e.step+' / '+e.tool.replaceAll('_',' ');$('events').textContent=JSON.stringify({step:e.step,tool:e.tool,arguments:e.arguments,ok:e.response.ok},null,2)+'\n\n'+$('events').textContent;let paths=images(e.response);if(paths.length){let r=await get('/'+paths.at(-1));let old=blob;blob=URL.createObjectURL(await r.blob());$('image').src=blob;if(old)URL.revokeObjectURL(old)}}let s=await(await get('/api/state')).json();$('status').textContent=s.finished?'Episode finished':'Observing · revision '+s.revision}catch(e){$('status').textContent=e.message}setTimeout(poll,1000)}poll();</script>
